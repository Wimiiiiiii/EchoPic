version: '3.8'

services:
  echopic:
    build: .
    container_name: echopic-app
    ports:
      - "5000:5000"
    volumes:
      - ./app/static/uploads:/app/static/uploads
      - ./app/static/results:/app/static/results
      - ./app/static/rp_curves:/app/static/rp_curves
      - ./app/features:/app/features
      - ./app/image.orig:/app/image.orig
    environment:
      - FLASK_APP=app/app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service supplémentaire : Redis pour le cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: 