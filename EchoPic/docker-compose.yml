version: "3"

services:
  web:
    build: .
    ports:
      - "5443:5443"  
    volumes:
      - ./app:/app/app
      - ./app/static:/app/static
      - ./app/features:/app/features
      - ./app/certs:/app/certs
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    networks:
      - echopic_network
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - echopic_network

networks:
  echopic_network:

volumes:
  postgres_data: 